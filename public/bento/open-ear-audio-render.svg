<svg width="400" height="340" viewBox="0 0 400 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="templeBody" x1="60" y1="120" x2="340" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="50%" stop-color="#6B21A8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="soundWaveGlow" cx="200" cy="170" r="80">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Wave Backdrop -->
  <circle cx="200" cy="170" r="100" fill="url(#soundWaveGlow)"/>

  <!-- Glasses Temple Section (Close-Up) -->
  <path d="M60 145 C 130 145, 270 150, 340 160 L 340 195 C 270 195, 130 190, 60 185 Z" fill="url(#templeBody)" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Speaker Acoustic Mesh Port -->
  <rect x="180" y="162" width="60" height="16" rx="8" fill="#130E24" stroke="#A78BFA" stroke-width="1.5"/>

  <!-- Micro Speaker Grille Holes -->
  <g fill="#A78BFA" opacity="0.85">
    <circle cx="192" cy="170" r="1.8"/>
    <circle cx="200" cy="170" r="1.8"/>
    <circle cx="208" cy="170" r="1.8"/>
    <circle cx="216" cy="170" r="1.8"/>
    <circle cx="224" cy="170" r="1.8"/>
  </g>

  <!-- Directional Soundwave Emission Arcs -->
  <path d="M 248 160 C 256 165, 256 175, 248 180" stroke="#8B5CF6" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 258 153 C 270 162, 270 178, 258 187" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 268 146 C 284 159, 284 181, 268 194" stroke="#C4B5FD" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Caption Label -->
  <text x="200" y="240" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.18em" fill="#6B21A8">DIRECTIONAL ACOUSTIC CHAMBER</text>
</svg>
