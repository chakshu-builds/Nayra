<svg width="400" height="340" viewBox="0 0 400 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="batteryCell" x1="120" y1="120" x2="280" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E192B"/>
      <stop offset="60%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
    <linearGradient id="powerEnergy" x1="130" y1="0" x2="270" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="170" r="90" fill="#7C3AED" fill-opacity="0.1"/>

  <!-- Battery Pack Outline -->
  <rect x="110" y="130" width="180" height="70" rx="14" fill="url(#batteryCell)" stroke="#8B5CF6" stroke-width="2"/>

  <!-- Battery Terminal / Anode -->
  <rect x="290" y="150" width="10" height="30" rx="4" fill="#C4B5FD" stroke="#7C3AED" stroke-width="1.5"/>

  <!-- Internal Circuit Traces & Power Cells -->
  <rect x="125" y="142" width="40" height="46" rx="6" fill="#130E24" stroke="#6D28D9" stroke-width="1"/>
  <rect x="175" y="142" width="40" height="46" rx="6" fill="#130E24" stroke="#6D28D9" stroke-width="1"/>
  <rect x="225" y="142" width="45" height="46" rx="6" fill="#130E24" stroke="#6D28D9" stroke-width="1"/>

  <!-- Power Flow Indicator Bolt -->
  <path d="M 204 150 L 194 167 L 202 167 L 196 182 L 210 164 L 202 164 Z" fill="url(#powerEnergy)"/>

  <!-- Micro Specification Label -->
  <text x="200" y="240" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.18em" fill="#6B21A8">PMIC COMPACT DUAL-CELL</text>
</svg>
