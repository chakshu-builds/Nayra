<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="circuitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#3B0764" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipSurface" x1="200" y1="90" x2="400" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E192B"/>
      <stop offset="50%" stop-color="#110E1A"/>
      <stop offset="100%" stop-color="#09070E"/>
    </linearGradient>
    <linearGradient id="goldPin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8B4FE"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <filter id="chipShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#8B5CF6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="300" cy="190" r="160" fill="url(#circuitGlow)"/>

  <!-- PCB Circuit Traces -->
  <g stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round" fill="none">
    <path d="M120 120 L 180 120 L 210 150"/>
    <path d="M90 190 L 190 190"/>
    <path d="M110 260 L 170 260 L 210 220"/>
    <path d="M480 120 L 420 120 L 390 150"/>
    <path d="M510 190 L 410 190"/>
    <path d="M490 260 L 430 260 L 390 220"/>
    <path d="M250 70 L 250 110"/>
    <path d="M300 50 L 300 110"/>
    <path d="M350 70 L 350 110"/>
    <path d="M250 310 L 250 270"/>
    <path d="M300 330 L 300 270"/>
    <path d="M350 310 L 350 270"/>
  </g>

  <!-- Circuit Trace Nodes -->
  <circle cx="120" cy="120" r="3" fill="#A78BFA"/>
  <circle cx="90" cy="190" r="3" fill="#A78BFA"/>
  <circle cx="110" cy="260" r="3" fill="#A78BFA"/>
  <circle cx="480" cy="120" r="3" fill="#A78BFA"/>
  <circle cx="510" cy="190" r="3" fill="#A78BFA"/>
  <circle cx="490" cy="260" r="3" fill="#A78BFA"/>

  <!-- RV1106 Silicon Package -->
  <rect x="210" y="100" width="180" height="180" rx="16" fill="url(#chipSurface)" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.6" filter="url(#chipShadow)"/>

  <!-- Metallic Heat Spreader / Center Core -->
  <rect x="235" y="125" width="130" height="130" rx="8" fill="#141120" stroke="#6D28D9" stroke-width="1.5"/>

  <!-- Laser Etching Text on Chip -->
  <text x="300" y="160" text-anchor="middle" font-family="'Sora', sans-serif" font-size="11" font-weight="700" letter-spacing="0.18em" fill="#C4B5FD">Rockchip</text>
  <text x="300" y="188" text-anchor="middle" font-family="'Sora', sans-serif" font-size="20" font-weight="800" letter-spacing="0.05em" fill="#FFFFFF">RV1106</text>
  <text x="300" y="210" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="0.22em" fill="#A78BFA">0.5 TOPS NPU • EDGE AI</text>
  <text x="300" y="235" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="500" letter-spacing="0.14em" fill="#6B7280">NAYRA ARCHITECTURE</text>

  <!-- Pin 1 Corner Indicator -->
  <circle cx="226" cy="116" r="3" fill="#A78BFA"/>
</svg>
