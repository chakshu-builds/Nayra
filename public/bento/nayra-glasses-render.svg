<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crystalGrad" x1="100" y1="120" x2="700" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#E2D9F3" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#C4B5FD" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="purpleTemple" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#7C3AED" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <ellipse cx="400" cy="240" rx="280" ry="140" fill="#8B5CF6" fill-opacity="0.08"/>

  <!-- Temples (Left and Right Arms) -->
  <path d="M120 185 C 100 190, 80 230, 95 270 C 105 295, 130 305, 145 300 L 220 220" stroke="url(#purpleTemple)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#glassShadow)"/>
  <path d="M680 185 C 700 190, 720 230, 705 270 C 695 295, 670 305, 655 300 L 580 220" stroke="url(#purpleTemple)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#glassShadow)"/>

  <!-- Left Frame Rim (Transparent Crystal) -->
  <rect x="190" y="160" width="180" height="150" rx="36" fill="url(#crystalGrad)" stroke="#FFFFFF" stroke-width="4" filter="url(#glassShadow)"/>
  <rect x="205" y="175" width="150" height="120" rx="26" fill="url(#lensGlow)" fill-opacity="0.2" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5"/>

  <!-- Right Frame Rim (Transparent Crystal) -->
  <rect x="430" y="160" width="180" height="150" rx="36" fill="url(#crystalGrad)" stroke="#FFFFFF" stroke-width="4" filter="url(#glassShadow)"/>
  <rect x="445" y="175" width="150" height="120" rx="26" fill="url(#lensGlow)" fill-opacity="0.2" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5"/>

  <!-- Nose Bridge (Sculpted Crystal) -->
  <path d="M370 195 Q 400 185 430 195 Q 400 205 370 195 Z" fill="url(#crystalGrad)" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Dual Camera Lenses (Foveal Perception Sensors) -->
  <!-- Left Camera -->
  <circle cx="175" cy="185" r="9" fill="#0F0D17" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="175" cy="185" r="5" fill="#1E1B4B"/>
  <circle cx="173" cy="183" r="2" fill="#A78BFA"/>

  <!-- Right Camera -->
  <circle cx="625" cy="185" r="9" fill="#0F0D17" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="625" cy="185" r="5" fill="#1E1B4B"/>
  <circle cx="623" cy="183" r="2" fill="#A78BFA"/>

  <!-- Temple Accent & Laser Etched NAYRA Wordmark -->
  <text x="110" y="222" font-family="'Sora', sans-serif" font-size="9" font-weight="700" letter-spacing="0.2em" fill="#E9D5FF" opacity="0.9">NAYRA</text>
  <text x="645" y="222" font-family="'Sora', sans-serif" font-size="9" font-weight="700" letter-spacing="0.2em" fill="#E9D5FF" opacity="0.9">NAYRA</text>

  <!-- Specular Lens Light Glare Reflex -->
  <path d="M220 185 L 290 185 L 245 285 L 210 285 Z" fill="#FFFFFF" fill-opacity="0.12"/>
  <path d="M460 185 L 530 185 L 485 285 L 450 285 Z" fill="#FFFFFF" fill-opacity="0.12"/>
</svg>
